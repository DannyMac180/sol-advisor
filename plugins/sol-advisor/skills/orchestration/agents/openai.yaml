interface:
  display_name: "Sol Advisor Orchestration"
  short_description: "Run Sol / Medium with monitored Luna Max threads, accept each graph layer, then identify node tasks safe to archive"
  default_prompt: "Use $orchestration with a gpt-5.6-sol / medium primary and no plugin/global model or effort pin on plans. When Codex app task tools and accepted GPT-5.6 Luna / Max routing are available, create and monitor subagent-like, separate user-visible Luna threads by default through list_projects, list_threads, create_thread, wait_threads, read_thread, and send_message_to_thread. For larger projects, write the PR dependency graph first, run independent nodes in parallel by layer, require each child to report commit, diff, tests, and blockers, and review/correct/submit each accepted PR before the next dependent stack; otherwise follow Sol Advisor's current shipped native workflow and its existing role/evidence routing. After every authorized graph node is accepted and integrated, identify the completed node tasks that are safe to archive, ask for explicit authorization before archiving them, keep the leader task by default, and distinguish task archival from worktree deletion."
