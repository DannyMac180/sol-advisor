interface:
  display_name: "Sol Advisor Orchestration"
  short_description: "Run Sol / Medium with leader-scheduled Luna Max tasks, same-task corrections, independent acceptance, and native Terra/Sol routing"
  default_prompt: "Use $orchestration with a gpt-5.6-sol / medium primary and no plugin/global model or effort pin on plans. When Codex app task tools and accepted GPT-5.6 Luna / Max routing are available, Sol schedules the default lane by creating each Luna Max execution unit as an independent, subagent-like, separate user-visible task through list_projects, list_threads, create_thread, wait_threads, read_thread, and send_message_to_thread; it monitors each task, sends corrections to that same task, and independently reviews and accepts it. For larger projects, write the layered PR dependency graph first, run independent nodes in parallel by layer, require each child to report commit, diff, tests, and blockers, and review/correct/authorize each accepted PR before the next dependent stack; otherwise retain the native Terra implementation and fresh Sol reviewer routing. After every authorized graph node is accepted and integrated, identify completed node tasks safe to archive, ask for explicit authorization before archiving, keep the leader task, and distinguish task archival from worktree deletion."
